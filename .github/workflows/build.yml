name: Build Luxury Lighting

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source zip from repo root
        run: |
          ZIP=$(ls LuxuryLighting*.zip 2>/dev/null | head -n1 || true)
          if [ -z "$ZIP" ]; then ZIP=$(ls *.zip | head -n1); fi
          echo "Using $ZIP"
          rm -rf _src && mkdir _src
          unzip -q -o "$ZIP" -d _src
          DIR=$(dirname "$(find _src -name build.gradle -print -quit)")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: LuxuryLighting-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
